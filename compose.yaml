services:
  api:
    build: ./backend
    environment:
      WMS_DB_URL: ${WMS_DB_URL:-jdbc:mysql://musepro-mysql:3306/miniwms}
      WMS_DB_USER: ${WMS_DB_USER:-miniwms_app}
      WMS_DB_PASSWORD: ${WMS_DB_PASSWORD:?Set WMS_DB_PASSWORD}
      WMS_ADMIN_PASSWORD: ${WMS_ADMIN_PASSWORD:?Set WMS_ADMIN_PASSWORD}
      WMS_PUBLIC_URL: ${WMS_PUBLIC_URL:?Set WMS_PUBLIC_URL to the HTTPS application origin}
      WMS_SECURE_COOKIE: "true"
      SPRING_PROFILES_ACTIVE: redis
      WMS_REDIS_HOST: redis
      WMS_REDIS_PASSWORD: ${WMS_REDIS_PASSWORD:?Set WMS_REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app
      - mysql
      - cache
    restart: unless-stopped
  redis:
    image: redis:8.2.11-alpine@sha256:da23c2478319ceb4903857d77a2fd7aa5137d9e9d4c8165dafbacedac6403e95
    command: ["redis-server", "--requirepass", "${WMS_REDIS_PASSWORD:?Set WMS_REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: ${WMS_REDIS_PASSWORD:?Set WMS_REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks: [cache]
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:18089:80"
    networks:
      - app
    restart: unless-stopped

networks:
  app:
  cache:
    internal: true
  mysql:
    external: true
    name: ${WMS_DB_NETWORK:-muse-pro_default}

volumes:
  redis-data:
