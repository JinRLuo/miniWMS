include /etc/nginx/modules-enabled/*.conf;

user www-data;
worker_processes 1;
worker_rlimit_nofile 2048;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 512;
}

stream {
    log_format ingress '$remote_addr [$time_local] $protocol $status '
                       '$bytes_sent $bytes_received $session_time $upstream_addr';
    access_log /var/log/nginx/miniwms-stream.log ingress buffer=16k flush=5s;

    proxy_connect_timeout 3s;
    proxy_timeout 300s;
    proxy_socket_keepalive on;
    proxy_buffer_size 8k;
    proxy_next_upstream off;

    server {
        listen 80;
        listen [::]:80;
        proxy_pass 172.24.182.10:80;
    }

    server {
        listen 443;
        listen [::]:443;
        proxy_pass 172.24.182.10:443;
    }
}
