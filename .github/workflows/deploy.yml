name: Deploy Mini WMS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miniwms-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      redis:
        image: redis:8.2.11-alpine@sha256:da23c2478319ceb4903857d77a2fd7aa5137d9e9d4c8165dafbacedac6403e95
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12
      mysql:
        image: mysql:8.0.45
        env:
          MYSQL_DATABASE: miniwms_migration_test
          MYSQL_USER: miniwms_test
          MYSQL_PASSWORD: miniwms-ci-test
          MYSQL_ROOT_PASSWORD: miniwms-ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=miniwms_test --password=miniwms-ci-test --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test and package backend
        env:
          WMS_TEST_REDIS_PORT: "6379"
          WMS_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/miniwms_migration_test?allowPublicKeyRetrieval=true&useSSL=false
          WMS_TEST_MYSQL_USER: miniwms_test
          WMS_TEST_MYSQL_PASSWORD: miniwms-ci-test
        run: |
          timestamp=$(git log -1 --format=%cI -- backend)
          mvn -B -ntp -f backend/pom.xml -Dproject.build.outputTimestamp="$timestamp" verify

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Publish production release
        id: deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MINIWMS_DEPLOY_HOST: ${{ vars.MINIWMS_DEPLOY_HOST }}
          MINIWMS_DEPLOY_KEY: ${{ secrets.MINIWMS_DEPLOY_KEY }}
          MINIWMS_DEPLOY_KNOWN_HOSTS: ${{ vars.MINIWMS_DEPLOY_KNOWN_HOSTS }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$tip" != "$GITHUB_SHA" ]]; then
            printf 'Skipping %s because main is now at %s\n' "$GITHUB_SHA" "$tip"
            exit 0
          fi

          : "${MINIWMS_DEPLOY_HOST:?Set the deployment host repository variable}"
          : "${MINIWMS_DEPLOY_KEY:?Set the deployment SSH key repository secret}"
          : "${MINIWMS_DEPLOY_KNOWN_HOSTS:?Set the pinned SSH host key repository variable}"

          umask 077
          work=$(mktemp -d "$RUNNER_TEMP/miniwms.XXXXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          python3 deploy/package-release.py "$work/release.tar.gz"
          printf '%s\n' "$MINIWMS_DEPLOY_KEY" > "$work/id_ed25519"
          printf '%s\n' "$MINIWMS_DEPLOY_KNOWN_HOSTS" > "$work/known_hosts"
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            -o "UserKnownHostsFile=$work/known_hosts" -i "$work/id_ed25519" \
            "miniwms-deploy@$MINIWMS_DEPLOY_HOST" < "$work/release.tar.gz"
          printf 'deployed=true\n' >> "$GITHUB_OUTPUT"

      - name: Notify deployment result via Bark
        if: ${{ !cancelled() && (failure() || steps.deploy.outputs.deployed == 'true') }}
        continue-on-error: true
        timeout-minutes: 1
        shell: python
        env:
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
          DEPLOYMENT_STATUS: ${{ job.status }}
        run: |
          import json
          import os
          import sys
          import urllib.request

          device_key = os.environ.get("BARK_DEVICE_KEY", "")
          if not device_key:
              print("::warning::Set the BARK_DEVICE_KEY repository secret to enable Bark notifications")
              sys.exit(0)

          repository = os.environ["GITHUB_REPOSITORY"]
          deployment_result = "部署成功" if os.environ["DEPLOYMENT_STATUS"] == "success" else "部署失败"
          payload = {
              "device_key": device_key,
              "title": f"Mini WMS {deployment_result}",
              "body": (
                  f"仓库：{repository}\n"
                  f"分支：{os.environ['GITHUB_REF_NAME']}\n"
                  f"提交：{os.environ['GITHUB_SHA'][:7]}"
              ),
              "group": "miniWMS",
              "icon": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              "url": f"{os.environ['GITHUB_SERVER_URL']}/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          request = urllib.request.Request(
              "https://bark.zoomzoom.team/push",
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.load(response)
          if result.get("code") != 200:
              sys.exit("Bark rejected the deployment notification")
          print("Bark deployment notification sent")
