spring:
  application:
    name: miniwms
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  datasource:
    url: ${WMS_DB_URL:jdbc:h2:file:./data/miniwms;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${WMS_DB_USER:sa}
    password: ${WMS_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
  jackson:
    deserialization:
      accept-float-as-int: false
server:
  address: ${WMS_BIND:127.0.0.1}
  servlet:
    session:
      timeout: 15d
      cookie:
        name: JSESSIONID
        max-age: 15d
        http-only: true
        same-site: lax
        secure: ${WMS_SECURE_COOKIE:false}
wms:
  zone: ${WMS_ZONE:Asia/Shanghai}
  public-url: ${WMS_PUBLIC_URL:}
  admin-password: ${WMS_ADMIN_PASSWORD:}
  demo: ${WMS_DEMO:false}
