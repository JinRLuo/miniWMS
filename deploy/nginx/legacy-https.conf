server {
    listen 80;
    server_name wms.zoomzoom.team;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/miniwms-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    include /opt/miniwms/nginx/site.inc;
}

server {
    listen 443 ssl;
    server_name wms.zoomzoom.team;
    ssl_certificate /etc/letsencrypt/live/wms.zoomzoom.team/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wms.zoomzoom.team/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/miniwms-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    include /opt/miniwms/nginx/site.inc;
}
